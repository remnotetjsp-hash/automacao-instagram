name: publicar-instagram
on:
  schedule:
    # minutos quebrados: o GitHub atrasa/descarta agendamentos no minuto 00 em horários de pico
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      duracao_min:
        description: "Minutos de vigia (padrão 340)"
        required: false
        default: "340"
permissions:
  contents: write
  actions: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Vigia (confere a fila a cada 4 min por ~5h40 e encadeia a próxima execução)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/media
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DURACAO_MIN: ${{ inputs.duracao_min || '340' }}
        run: bash scripts/vigia.sh
